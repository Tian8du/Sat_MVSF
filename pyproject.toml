[project]
name = "sat-mvsf"
version = "0.1.2"
description = "Satellite Multi-View Stereo reconstruction with CPU-blocked projection, PyTorch support, and GDAL/CuPy integration"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chen Liu (Wuhan University)" }]
keywords = ["satellite", "MVS", "3D reconstruction", "remote sensing", "PyTorch", "GDAL"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

# ---- Core + Platform-Specific Dependencies ----
dependencies = [
  "python-dateutil>=2.8",
  "numpy>=1.26,<2",
  "opencv-python>=4.8",
  "imageio>=2.31",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "laspy>=2.5",

  # ✅ 自动安装完整依赖（仅在 Linux）
  "torch>=2.2,<3; platform_system == 'Linux'",
  "torchvision>=0.17,<0.20; platform_system == 'Linux'",
  "torchaudio>=2.2,<3; platform_system == 'Linux'",
  "GDAL>=3.4; platform_system == 'Linux'",
  "cupy-cuda11x>=13.0,<14.0; platform_system == 'Linux'",
]

[project.optional-dependencies]
# 开发环境专用
dev = ["build", "twine", "wheel"]

[project.scripts]
satmvsf = "satmvs.satmvs_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["satmvs*"]

[tool.setuptools.package-data]
satmvs = [
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "config/**",
  "assets/**",
  "checkpoints/*.ckpt"
]
